name: Auto-merge

# After the CI workflow succeeds on a PR branch, squash-merge into main.
# Skips drafts. Requires this workflow's token permissions (contents + pull-requests).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  merge:
    name: Squash-merge green PR
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["pull_request", "push"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Find and merge open PR for head SHA
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = run.head_sha;
            const headBranch = run.head_branch;

            core.info(`CI success for ${headBranch} @ ${headSha}`);

            // Resolve PR(s): workflow_run.pull_requests is often empty for same-repo PRs
            let prs = [];
            if (run.pull_requests && run.pull_requests.length > 0) {
              for (const ref of run.pull_requests) {
                const { data } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: ref.number,
                });
                prs.push(data);
              }
            } else if (headBranch) {
              const { data } = await github.rest.pulls.list({
                owner,
                repo,
                state: "open",
                head: `${owner}:${headBranch}`,
                per_page: 10,
              });
              prs = data;
            }

            if (prs.length === 0) {
              core.info("No open PR found for this run; nothing to merge.");
              return;
            }

            for (const pr of prs) {
              if (pr.draft) {
                core.info(`Skip draft PR #${pr.number}`);
                continue;
              }
              if (pr.base.ref !== "main") {
                core.info(`Skip PR #${pr.number}: base is ${pr.base.ref}, want main`);
                continue;
              }
              if (pr.head.sha !== headSha) {
                core.info(
                  `Skip PR #${pr.number}: head ${pr.head.sha} != CI sha ${headSha}`
                );
                continue;
              }

              // Confirm the CI check suite / runs for this SHA are successful
              const { data: checks } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: headSha,
                filter: "latest",
                per_page: 100,
              });
              const ciRuns = (checks.check_runs || []).filter(
                (c) => c.name === "Python checks" || c.app?.slug === "github-actions"
              );
              const failed = ciRuns.filter(
                (c) =>
                  c.status === "completed" &&
                  c.conclusion &&
                  !["success", "neutral", "skipped"].includes(c.conclusion)
              );
              const pending = ciRuns.filter((c) => c.status !== "completed");
              if (failed.length > 0) {
                core.setFailed(
                  `Refusing merge: failed checks: ${failed.map((c) => c.name).join(", ")}`
                );
                return;
              }
              if (pending.length > 0) {
                core.info(
                  `Checks still pending: ${pending.map((c) => c.name).join(", ")}`
                );
                return;
              }

              core.info(`Merging PR #${pr.number} (${pr.title}) via squash`);
              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.number,
                  merge_method: "squash",
                  sha: headSha,
                  commit_title: `${pr.title} (#${pr.number})`,
                });
                core.info(`Merged #${pr.number}`);
              } catch (err) {
                const msg = err instanceof Error ? err.message : String(err);
                // Already merged / not mergeable — don't fail the whole job noisily
                if (/not mergeable|Pull Request is not mergeable|already merged/i.test(msg)) {
                  core.warning(`Could not merge #${pr.number}: ${msg}`);
                  continue;
                }
                throw err;
              }
            }
